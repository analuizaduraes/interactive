<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Interactive rating component</title>
  <link rel="stylesheet" href="reset.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div class="container">
    <!--cartão1-->
    <div class="card card-1">
      <div class="icon">
        <img src="./images/icon-star.svg" alt="star image">
      </div>

      <h2 class="title">How did we do?</h2>

      <p class="text">Please let us know how we did with your support request. All feedback is appreciated
        to help us improve our offering!</p>

        <section class="aval_btn">

       
      <div class="avaliação">
        <div class="aval" onclick="selectRating(1)">1</div>
        <div class="aval" onclick="selectRating(2)">2</div>
        <div class="aval" onclick="selectRating(3)">3</div>
        <div class="aval" onclick="selectRating(4)">4</div>
        <div class="aval" onclick="selectRating(5)">5</div>
      </div>

      <button class="button" onclick="submit()">Submit</button>
       </section>
    </div>


    <!--cartão2-->
    <div class="card card-2 hidden" >
      <img class="image-cel" src="./images/illustration-thank-you.svg" alt="thank you image">

      <div class="selectors">You selected <span>1</span> out of 5</div>

      <h2 class="title">Thank you!</h2>

      <p class="text-card2">We appreciate you taking the time to give a rating. If you ever need more support,
        don’t hesitate to get in touch!</p>
    </div>

  </div>

  <script type="text/javascript" src="script.js"></script>
</body>
</html>
